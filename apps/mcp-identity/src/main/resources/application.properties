server.port=${PORT:8092}
spring.application.name=mcp-identity
spring.datasource.url=${STS_DATABASE_URL}
spring.datasource.username=${STS_DATABASE_USER}
spring.datasource.password=${STS_DATABASE_PASSWORD}
spring.ai.mcp.server.name=sts-identity
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.springframework.ai=WARN
logging.level.io.modelcontextprotocol=WARN
