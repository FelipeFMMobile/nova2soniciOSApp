name: Modular applications
on: [push, pull_request]
jobs:
  go-module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [packages/go/agentwire, apps/personal-assistant-agent, packages/go/audio, packages/go/mcpwire, packages/go/voicewire, packages/go/testkit, apps/mcp-notes, apps/mcp-agenda, apps/voice-client, apps/voice-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - run: python3 scripts/modules.py build
        env:
          GOCACHE: /tmp/sts-go-cache
      - run: go test -race ./... && go vet ./...
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: 'off'
          GOCACHE: /tmp/sts-go-cache
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: python3 scripts/modules.py boundaries
      - run: python3 scripts/modules.py isolated
        env:
          GOCACHE: /tmp/sts-go-cache
      - run: python3 scripts/modules.py build
        env:
          GOCACHE: /tmp/sts-go-cache
      - run: go test ./...
        env:
          GOWORK: 'off'
      - run: python3 -m unittest discover -s tests/scripts -v
      - run: python3 harness/run.py --check
