services:
  qwen:
    build:
      context: .
      args:
        VLLM_OMNI_IMAGE: ${VLLM_OMNI_IMAGE:-vllm/vllm-omni:v0.28.0}
    image: sts-qwen-omni:0.2.0
    restart: unless-stopped
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      QWEN_MODEL: ${QWEN_MODEL:-Qwen/Qwen3-Omni-30B-A3B-Instruct}
      QWEN_MODEL_REVISION: ${QWEN_MODEL_REVISION:-26291f7}
      MODEL_CACHE: /workspace/models
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-32768}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8091:8091"
    volumes:
      - /workspace:/workspace
    shm_size: 16gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

